<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실시간 관측 · 숲여울기후환경넷</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="style.css">
<style>
  /* 히어로 */
  .mon-hero{position:relative;min-height:52vh;display:flex;align-items:flex-end;color:#fff;padding:56px 0 64px;background-size:cover;background-position:center 42%;}
  .mon-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(12,22,16,.25),rgba(12,22,16,.78));}
  .mon-hero .hero-inner{width:100%;}
  .mon-hero .eyebrow{color:#9be3c0;}
  .mon-hero h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.15;margin-bottom:12px;text-shadow:0 2px 12px rgba(0,0,0,.3);}
  .mon-hero p.lede{max-width:48ch;color:rgba(255,255,255,.9);margin:0 0 22px;}
  .live-badge{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);font-size:.86rem;font-weight:600;}
  .live-dot{width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:livePulse 1.8s infinite;}
  @keyframes livePulse{70%{box-shadow:0 0 0 9px rgba(74,222,128,0);}100%{box-shadow:0 0 0 0 rgba(74,222,128,0);}}
  @media (prefers-reduced-motion:reduce){.live-dot{animation:none;}}

  /* 현재 값 카드 */
  .al-wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}
  .al-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:-44px;position:relative;z-index:2;}
  .al-card{border:1px solid var(--line);border-radius:16px;padding:22px 22px 24px;background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.07);display:flex;align-items:center;gap:16px;transition:box-shadow .15s ease, transform .15s ease;}
  .al-card:hover{box-shadow:0 16px 34px rgba(0,0,0,.11);transform:translateY(-2px);}
  .al-icon{flex:0 0 48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
  .al-icon svg{width:24px;height:24px;}
  .al-icon.water{background:#e6f4ee;color:var(--accent-dark);}
  .al-icon.temp{background:#fdeee6;color:#c9602e;}
  .al-icon.hum{background:#e8f0fb;color:#3569b8;}
  .al-label{font-size:.86rem;color:var(--ink-dim);margin-bottom:4px;}
  .al-value{font-size:1.9rem;font-weight:800;color:var(--ink);line-height:1.1;}
  .al-unit{font-size:.95rem;color:var(--ink-dim);font-weight:600;margin-left:3px;}

  /* 그래프 */
  .mon-chart-section{padding-top:56px;}
  .tsw-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 22px 12px;box-shadow:0 8px 24px rgba(0,0,0,.04);}
  .tsw-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;margin-bottom:14px;}
  .tsw-title{font-size:1.02rem;font-weight:700;}
  .tsw-updated{font-size:.8rem;color:var(--ink-dim);}
  .tsw-chart-wrap{position:relative;width:100%;height:360px;}
  .tsw-msg{color:var(--ink-dim);font-size:.9rem;text-align:center;padding:40px 0;}


  @media (max-width:520px){
    .mon-hero{min-height:52vh;padding:40px 0 64px;}
    .al-wrap{padding:0 18px;}
    .al-cards{grid-template-columns:repeat(3,1fr);gap:10px;}
    .al-card{flex-direction:column;align-items:flex-start;gap:10px;padding:14px 12px 16px;border-radius:14px;}
    .al-icon{flex:none;width:36px;height:36px;border-radius:10px;}
    .al-icon svg{width:18px;height:18px;}
    .al-label{font-size:.78rem;margin-bottom:2px;}
    .al-value{font-size:1.3rem;}
    .al-unit{font-size:.8rem;margin-left:2px;}
    .tsw-card{padding:16px 12px 8px;}
    .tsw-chart-wrap{height:280px;}
  }
</style>
</head>

<div class="tsw-card">
  <div class="tsw-head">
    <div class="tsw-title" id="tsw-title">불러오는 중…</div>
    <div class="tsw-updated" id="tsw-updated"></div>

  <div class="tsw-chart-wrap"><canvas id="tsw-chart"></canvas></div>
  <div class="tsw-msg" id="tsw-msg" style="display:none"></div>
</div>

<script>
(function(){
/* ========= 여기만 바꾸면 됨 (내가 원하는대로) ========= */
var CONFIG = {
  channelId:   "3441553",  // ← ThingSpeak 채널 ID (필수)
  readApiKey:  "",                    // 공개 채널이면 비워두기 / 비공개면 Read API Key
  field:       1,                     // 1=수위, 2=기온, 3=습도
  days:        14,                    // 며칠치 (14 = 2주)

  chartType:   "line",               // "line" 또는 "bar"
  title:       "대치저수지 수위 (일별 최근값)",
  yLabel:      "수위 (mm)",
  yMin:        0,                     // y축 최솟값
  yMax:        250,                   // y축 최댓값
  lineColor:   "#2f9e6f",            // 선/막대 색
  fillColor:   "rgba(47,158,111,0.12)", // line 아래 채움색
  showValues:  true,                 // 각 점 위 숫자 표시
  refreshMinutes: 0                  // 자동 새로고침(분). 0이면 끔
};
/* ================================================== */

var WD=["일","월","화","수","목","금","토"];
function $(id){return document.getElementById(id);}
function showMsg(t){var c=$("tsw-chart");if(c)c.style.display="none";var m=$("tsw-msg");m.style.display="block";m.textContent=t;}

function ensureChart(cb){
  if(window.Chart)return cb();
  var s=document.createElement("script");
  s.src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js";
  s.onload=cb; s.onerror=function(){showMsg("Chart.js 로드 실패");};
  document.head.appendChild(s);
}

function loadData(){
  var base="https://api.thingspeak.com/channels/"+CONFIG.channelId+"/fields/"+CONFIG.field+".json";
  var u=new URL(base);
  u.searchParams.set("days",CONFIG.days+1);
  u.searchParams.set("timezone","Asia/Seoul");   // created_at을 한국시간 기준으로
  if(CONFIG.readApiKey)u.searchParams.set("api_key",CONFIG.readApiKey);
  return fetch(u).then(function(r){if(!r.ok)throw new Error("응답 "+r.status);return r.json();})
    .then(function(data){
      var feeds=(data&&data.feeds)||[];
      var key="field"+CONFIG.field;
      feeds.sort(function(a,b){return a.created_at<b.created_at?-1:a.created_at>b.created_at?1:0;});
      var byDate={};
      feeds.forEach(function(f){
        var v=f[key];
        if(v===null||v===undefined||v==="")return;
        var date=f.created_at.slice(0,10);        // YYYY-MM-DD (KST)
        byDate[date]={date:date,time:f.created_at.slice(11,16),value:parseFloat(v)}; // 그 날 마지막값
      });
      return Object.keys(byDate).sort().slice(-CONFIG.days).map(function(k){return byDate[k];});
    });
}

var valueLabels={id:"tswVals",afterDatasetsDraw:function(chart){
  if(!CONFIG.showValues)return;
  var ctx=chart.ctx,meta=chart.getDatasetMeta(0);
  ctx.save();ctx.font="600 11px sans-serif";ctx.fillStyle="#111827";ctx.textAlign="center";
  meta.data.forEach(function(pt,i){var val=chart.data.datasets[0].data[i];
    if(val!=null)ctx.fillText(String(val),pt.x,pt.y-8);});
  ctx.restore();
}};

function render(rows){
  $("tsw-title").textContent=CONFIG.title;
  if(!rows.length){showMsg("최근 "+CONFIG.days+"일간 데이터가 없어요.");return;}
  var labels=rows.map(function(r){var p=r.date.split("-").map(Number);
    var wd=WD[new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay()];return p[1]+"/"+p[2]+"("+wd+")";});
  var values=rows.map(function(r){return r.value;});
  var last=rows[rows.length-1];
  $("tsw-updated").textContent="최근 "+last.date+" "+last.time+" 기준";
  new Chart($("tsw-chart"),{
    type:CONFIG.chartType,
    data:{labels:labels,datasets:[{label:CONFIG.yLabel,data:values,
      borderColor:CONFIG.lineColor,
      backgroundColor:CONFIG.chartType==="bar"?CONFIG.lineColor:CONFIG.fillColor,
      fill:CONFIG.chartType==="line",tension:0.3,pointRadius:4,
      pointBackgroundColor:CONFIG.lineColor,borderWidth:2,borderRadius:6}]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:18,right:12}},
      plugins:{legend:{display:false},tooltip:{intersect:false,mode:"index"}},
      scales:{y:{min:CONFIG.yMin,max:CONFIG.yMax,title:{display:true,text:CONFIG.yLabel},grid:{color:"rgba(128,128,128,0.15)"}},
              x:{grid:{display:false}}}},
    plugins:[valueLabels]
  });
}

ensureChart(function(){
  loadData().then(render).catch(function(e){showMsg("데이터를 못 불러왔어요: "+e.message);});
  if(CONFIG.refreshMinutes>0)setInterval(function(){location.reload();},CONFIG.refreshMinutes*60000);
});
})();
</script>

</section>

<script>
function toggleNav(){
  document.querySelector('.nav').classList.toggle('nav-open');
}

function setLang(lang){
  document.querySelectorAll('[data-en]').forEach(el => {
    if (el.dataset.ko === undefined) el.dataset.ko = el.innerHTML;
    el.innerHTML = lang === 'en' ? el.dataset.en : el.dataset.ko;
  });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  document.documentElement.lang = lang;
}
</script>

  
<script>
   
  const CH  = "3441553";
   const KEY = "";
  // ▲▲▲

  async function loadAmphi() {
    if (CH === "여기_채널ID") return; // 아직 미설정
    const url = `https://api.thingspeak.com/channels/${CH}/feeds.json?results=1`
              + (KEY ? `&api_key=${KEY}` : "");
    try {
      const res = await fetch(url);
      const data = await res.json();
      const f = data.feeds && data.feeds[0];
      if (!f) { document.getElementById("al-time").textContent = "아직 데이터가 없어요."; return; }

      // field1=수위(mm), field2=기온, field3=습도
      const lvl = f.field1;
      document.getElementById("al-level").textContent =
        (lvl === null || lvl === undefined || lvl === "-1") ? "측정실패" : lvl;
      document.getElementById("al-temp").textContent =
        (f.field2 === null || f.field2 === undefined || f.field2 === "nan") ? "–" : f.field2;
      document.getElementById("al-hum").textContent =
        (f.field3 === null || f.field3 === undefined || f.field3 === "nan") ? "–" : f.field3;

      const t = new Date(f.created_at);
      document.getElementById("al-time").textContent =
        "업데이트: " + t.toLocaleString("ko-KR");
    } catch (e) {
      document.getElementById("al-time").textContent = "데이터를 불러오지 못했어요.";
      console.error(e);
    }
  }

  loadAmphi();
  setInterval(loadAmphi, 60000); // 1분마다 새로고침
</script>
